[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mirror-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "neo4j>=5.24.0",
    "qdrant-client[fastembed]>=1.11.0",
    "openai>=1.51.0",
    "python-slugify>=8.0.0",
    "slowapi>=0.1.9",
    "asyncpg>=0.29.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "networkx>=3.2",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",          # mock httpx (LLM + JWKS)
    "asgi-lifespan>=2.1.0",   # run lifespan in tests without a real server
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "golden: tests that call the real LLM (run sparingly, costs tokens)",
  "integration: tests needing real Neo4j/Postgres/Qdrant",
]
