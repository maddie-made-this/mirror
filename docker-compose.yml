services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      # Credentials come from the gitignored .env at the repo root — never
      # committed. Copy .env.example to .env and set a value. The `:?` form makes
      # compose fail loudly on an unset var rather than silently starting an
      # open database.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required — copy .env.example to .env}
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
  qdrant_data: