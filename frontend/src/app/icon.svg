<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mirror">
  <title>Mirror</title>
  <!-- Badge -->
  <rect width="512" height="512" rx="116" fill="#132F5E"/>

  <!-- Hand mirror: handle first so the head overlaps its top cleanly -->
  <rect x="233" y="330" width="46" height="132" rx="23" fill="#3ED8F0"/>

  <!-- Head: cyan disc, navy ring, cyan glass. The ring is kept thin so the
       glass stays large — the motif inside has to survive a 16px favicon. -->
  <ellipse cx="256" cy="222" rx="112" ry="134" fill="#3ED8F0"/>
  <ellipse cx="256" cy="222" rx="92" ry="114" fill="#132F5E"/>
  <ellipse cx="256" cy="222" rx="84" ry="106" fill="#3ED8F0"/>

  <!-- ONE motif, sized big. An 8-node graph turned to mush below ~32px; three
       large nodes in a triangle still read as "graph" at favicon size. -->
  <g stroke="#132F5E" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M256 176 L214 252"/>
    <path d="M256 176 L298 252"/>
    <path d="M214 252 L298 252"/>
  </g>
  <g fill="#132F5E">
    <circle cx="256" cy="176" r="25"/>
    <circle cx="214" cy="252" r="25"/>
    <circle cx="298" cy="252" r="25"/>
  </g>
</svg>
